{% extends "base.html" %}

{% block titulo %}Entrar - Sessão Zero{% endblock %}

{% block conteudo %}
    <section class="painel">
        <h1>Entrar</h1>
        <form class="caixa" method="post" novalidate>
            {% csrf_token %}
            {% include "partials/_form_campos.html" %}
            <div class="acoes">
                <button class="botao botao--cheio" type="submit">Entrar</button>
            </div>
        </form>
        <p class="painel__rodape">
            <a href="{% url 'solicitar_recuperacao_senha' %}">Esqueci minha senha</a><br>
            <a href="{% url 'reenviar_confirmacao' %}">Não recebi o e-mail de confirmação</a><br>
            Ainda não tem conta? <a href="{% url 'cadastro' %}">Criar conta</a>
        </p>
    </section>
{% endblock %}
