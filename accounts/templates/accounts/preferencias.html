{% extends "base.html" %}

{% block titulo %}Preferências - Sessão Zero{% endblock %}

{% block conteudo %}
    <section class="painel painel--larga">
        <h1>Preferências</h1>
        <form class="caixa" method="post" novalidate>
            {% csrf_token %}
            <p>Marque o que você curte jogar. Usamos isso para recomendar campanhas parecidas.</p>
            {% include "partials/_form_campos.html" %}
            <div class="acoes">
                <button class="botao" type="submit">Salvar preferências</button>
                <a class="botao botao--secundario" href="{% url 'campanhas_recomendadas' %}">Ver recomendadas</a>
            </div>
        </form>
    </section>
{% endblock %}
