<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sessão Zero fora do ar por um instante</title>
    <style>
        :root { color-scheme: light dark; }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 1.5rem;
               font: 1rem/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
               background: #1b1d33; color: #eef0fb; }
        main { max-width: 34rem; text-align: center; }
        .codigo { font-size: 4rem; font-weight: 700; margin: 0; color: #f2c14e; }
        h1 { margin: 0 0 .75rem; font-size: 1.5rem; }
        p { margin: .5rem 0; }
        a { color: #f2c14e; }
        .botao { display: inline-block; margin-top: 1rem; padding: .6rem 1.2rem; border-radius: .5rem;
                 background: #f2c14e; color: #1b1d33; font-weight: 600; text-decoration: none; }
    </style>
</head>
<body>
    <main>
        <p class="codigo" aria-hidden="true">503</p>
        <h1>Estamos com uma instabilidade</h1>
        <p>A Sessão Zero não conseguiu falar com o banco de dados agora. Isso costuma passar em instantes.</p>
        <p>Nada do que você já tinha salvo foi perdido. Tente de novo em alguns segundos.</p>
        <a class="botao" href="">Tentar de novo</a>
    </main>
</body>
</html>
